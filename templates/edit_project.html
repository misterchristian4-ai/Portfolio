{% extends 'base.html' %}

{% block title %}Edit Project{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="win login-card wide">
        <div class="win-bar">
            <div class="win-dots"><span></span><span></span><span></span></div>
            <span class="win-title">edit-project.sh</span>
        </div>
        <div class="win-body">
            <h1>Edit Project</h1>
            <p>Modify the details below to update your portfolio project.</p>

            <form action="/edit/{{ project.id }}" method="POST" enctype="multipart/form-data" class="login-form">

                <div class="form-group">
                    <label for="title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>title</label>
                    <input type="text" id="title" name="title" value="{{ project.title }}" placeholder="e.g., E-Commerce Platform" required>
                </div>

                <div class="form-group">
                    <label for="description"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>description</label>
                    <textarea id="description" name="description" placeholder="Describe your project..." required>{{ project.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="github"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>github</label>
                    <input type="url" id="github" name="github" value="{{ project.github }}" placeholder="https://github.com/..." required>
                </div>

                <div class="form-group">
                    <label for="demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>demo</label>
                    <input type="url" id="demo" name="demo" value="{{ project.demo }}" placeholder="https://yourdemo.com">
                </div>

                <div class="form-group">
                    <label for="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>image</label>
                    <input type="file" id="image" name="image" accept="image/*">
                    <span class="field-hint">Current image: {{ project.image }} (leave blank to keep current image)</span>
                </div>

                <button type="submit" class="btn-login">./save.sh</button>
            </form>

            <a href="/dashboard" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>cancel and go back</a>
        </div>
    </div>
</div>
{% endblock %}
