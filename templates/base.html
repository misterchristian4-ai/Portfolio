<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% block content %}
    {% endblock %}

    <script>
        document.querySelectorAll('.flash-message').forEach(function (el, i) {
            setTimeout(function () {
                el.classList.add('is-hiding');
                el.addEventListener('transitionend', function () {
                    el.remove();
                }, { once: true });
            }, 4000 + i * 200);
        });
    </script>
</body>
</html>
